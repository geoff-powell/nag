name: Bump version

# Changes the app version (MARKETING_VERSION in Config/Base.xcconfig) on a new branch and opens a
# pull request for it. Start it from Actions > Bump version > Run workflow. Merging the pull request
# ships the new version, like any other merge to main.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Pull requests opened with the workflow's token don't start other workflows, so this starts Tests
# on the branch itself; its result shows on the pull request.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to bump, or "set" to use the version below
        type: choice
        options: [patch, minor, major, set]
        default: minor
      version:
        description: Exact version, like 1.4 or 1.4.2 (only with "set")
        type: string
        required: false

concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Open version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Change the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$BUMP" == set ]]; then
            if [[ -z "$VERSION" ]]; then
              echo "::error::Enter a version to use \"set\"."
              exit 1
            fi
            arg="$VERSION"
          else
            arg="$BUMP"
          fi
          old="$(source scripts/lib.sh && marketing_version)"
          new="$(scripts/bump-version.sh "$arg")"
          echo "Version $old -> $new"
          {
            echo "old=$old"
            echo "version=$new"
            echo "branch=bump-version/$new"
          } >> "$GITHUB_OUTPUT"

      - name: Push the branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists. Merge or close its pull request and delete the branch first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore: bump version to $VERSION"
          git push origin "$BRANCH"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OLD: ${{ steps.bump.outputs.old }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          url="$(gh pr create --base main --head "$BRANCH" \
            --title "chore: bump version to $VERSION" \
            --body "Changes the app version from $OLD to $VERSION. Opened by the Bump version workflow, started by @$GITHUB_ACTOR. Merging this ships $VERSION.")"
          echo "Opened $url"
          echo "Opened [the version pull request]($url)." >> "$GITHUB_STEP_SUMMARY"

      - name: Start Tests on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: gh workflow run tests.yml --ref "$BRANCH"
