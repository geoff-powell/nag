name: Deploy

# Uploads the iPhone app to TestFlight and/or publishes a notarized Mac app as a GitHub release.
# Run it from Actions > Deploy > Run workflow, or push a tag like v1.0.
# Required secrets are listed in the README under "Deploying from GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      platform:
        description: What to deploy
        type: choice
        options: [both, iphone, mac]
        default: both
  push:
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_IPHONE: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'iphone' }}
  DEPLOY_MAC: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'mac' }}

jobs:
  # Cheap Linux check, so missing setup fails in seconds rather than after the macOS tests.
  preflight:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      iphone: ${{ env.DEPLOY_IPHONE }}
      mac: ${{ env.DEPLOY_MAC }}
    steps:
      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGNING_CERTS_P12_BASE64: ${{ secrets.SIGNING_CERTS_P12_BASE64 }}
          SIGNING_CERTS_P12_PASSWORD: ${{ secrets.SIGNING_CERTS_P12_PASSWORD }}
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          required=(ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 SIGNING_CERTS_P12_BASE64 SIGNING_CERTS_P12_PASSWORD)
          if [[ "$DEPLOY_MAC" == true ]]; then
            required+=(MAC_PROFILE_BASE64)
          fi
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See README > Deploying from GitHub Actions."
            exit 1
          fi
          echo "iPhone: $DEPLOY_IPHONE, Mac: $DEPLOY_MAC"

  tests:
    needs: preflight
    uses: ./.github/workflows/tests.yml

  iphone:
    name: iPhone to TestFlight
    needs: [preflight, tests]
    if: needs.preflight.outputs.iphone == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apple-signing
        with:
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          certificates-p12-base64: ${{ secrets.SIGNING_CERTS_P12_BASE64 }}
          certificates-p12-password: ${{ secrets.SIGNING_CERTS_P12_PASSWORD }}

      - name: Archive and upload
        run: scripts/testflight.sh

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-logs
          path: build/ios/*.log

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  mac:
    name: Mac to GitHub release
    needs: [preflight, tests]
    if: needs.preflight.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apple-signing
        with:
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          certificates-p12-base64: ${{ secrets.SIGNING_CERTS_P12_BASE64 }}
          certificates-p12-password: ${{ secrets.SIGNING_CERTS_P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.MAC_PROFILE_BASE64 }}

      - name: Archive, notarize and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-mac.sh

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: build/mac/*.log

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
