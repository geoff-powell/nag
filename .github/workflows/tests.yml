name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Deploy runs these first.
  workflow_call:
  # Bump version starts these for its pull request, which doesn't trigger pull_request runs.
  workflow_dispatch:

concurrency:
  # In a called workflow, github.workflow is the caller's name, so deploys never cancel push runs.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Unit tests
        run: swift test --package-path Packages/NagKit

      - name: Build iPhone app and extensions
        run: >
          xcodebuild -project Nag.xcodeproj -scheme Nag
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-dd
          CODE_SIGNING_ALLOWED=NO -quiet build

      # A target with no Sources phase still "builds", producing an extension with no code that
      # only fails when installed on a device. Check every embedded extension has its executable.
      - name: Check extensions have executables
        run: |
          app=build/ios-dd/Build/Products/Debug-iphonesimulator/Nag.app
          status=0
          for appex in "$app"/PlugIns/*.appex; do
            exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")"
            if [[ -f "$appex/$exe" ]]; then
              echo "OK $(basename "$appex")"
            else
              echo "::error::$(basename "$appex") has no executable ($exe)."
              status=1
            fi
          done
          exit $status

      - name: Build Mac app
        run: >
          xcodebuild -project Nag.xcodeproj -scheme NagMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO -quiet build

      # Launches the menu bar app and fails if it hangs, spins or balloons (see NagMacUITests).
      # Signed ad hoc without entitlements: the runner has no team, and the tests stay off iCloud.
      - name: Mac UI tests
        run: >
          xcodebuild -project Nag.xcodeproj -scheme NagMac
          -destination 'platform=macOS'
          -only-testing:NagMacUITests
          -resultBundlePath build/mac-ui-tests.xcresult
          NAG_MAC_SIGN_IDENTITY=- NAG_MAC_CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=
          -quiet test

      - name: Upload Mac UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-ui-tests
          path: build/mac-ui-tests.xcresult
