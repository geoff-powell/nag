name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Deploy runs these first.
  workflow_call:
  # Bump version starts these for its pull request, which doesn't trigger pull_request runs.
  workflow_dispatch:

concurrency:
  # In a called workflow, github.workflow is the caller's name, so deploys never cancel push runs.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Unit tests
        run: swift test --package-path Packages/NagKit

      - name: Build iPhone app and extensions
        run: >
          xcodebuild -project Nag.xcodeproj -scheme Nag
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Build Mac app
        run: >
          xcodebuild -project Nag.xcodeproj -scheme NagMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO -quiet build
