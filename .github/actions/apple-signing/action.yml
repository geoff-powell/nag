name: Apple signing
description: >
  Selects the newest Xcode, writes the App Store Connect API key, imports signing certificates into a
  temporary keychain, and optionally installs a provisioning profile. Run the cleanup step from the
  calling job with `if: always()`.

inputs:
  api-key-id:
    required: true
  api-issuer-id:
    required: true
  api-key-p8-base64:
    required: true
  certificates-p12-base64:
    required: true
  certificates-p12-password:
    required: true
  provisioning-profile-base64:
    description: Optional. Installed, and its name exported as NAG_MAC_PROFILE_NAME.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select newest Xcode
      shell: bash
      run: |
        xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
        sudo xcode-select -s "$xcode"
        xcodebuild -version

    - name: App Store Connect API key
      shell: bash
      env:
        KEY_P8: ${{ inputs.api-key-p8-base64 }}
        KEY_ID: ${{ inputs.api-key-id }}
        ISSUER_ID: ${{ inputs.api-issuer-id }}
      run: |
        key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
        printf '%s' "$KEY_P8" | base64 --decode > "$key"
        chmod 600 "$key"
        {
          echo "ASC_KEY_PATH=$key"
          echo "ASC_KEY_ID=$KEY_ID"
          echo "ASC_ISSUER_ID=$ISSUER_ID"
        } >> "$GITHUB_ENV"

    - name: Signing certificates
      shell: bash
      env:
        P12: ${{ inputs.certificates-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificates-p12-password }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(uuidgen)"
        printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        rm "$RUNNER_TEMP/certificates.p12"
        echo "Signing identities:"
        security find-identity -v -p codesigning "$keychain" | sed -E 's/[0-9A-F]{40}/<hash>/'

    - name: Provisioning profile
      if: inputs.provisioning-profile-base64 != ''
      shell: bash
      env:
        PROFILE: ${{ inputs.provisioning-profile-base64 }}
      run: |
        file="$RUNNER_TEMP/profile.provisionprofile"
        printf '%s' "$PROFILE" | base64 --decode > "$file"
        uuid="$(security cms -D -i "$file" | plutil -extract UUID raw -)"
        name="$(security cms -D -i "$file" | plutil -extract Name raw -)"
        # Xcode 16 and later read the first folder; earlier versions the second.
        for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
          mkdir -p "$dir"
          cp "$file" "$dir/$uuid.provisionprofile"
        done
        echo "Installed profile: $name"
        echo "NAG_MAC_PROFILE_NAME=$name" >> "$GITHUB_ENV"
